version: '3.8'

services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: angular-dev-app
    ports:
      - "4200:4200"
    volumes:
      - ./src:/app/src

  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: angular-prod-app
    ports:
      - "8080:80"
    restart: always
