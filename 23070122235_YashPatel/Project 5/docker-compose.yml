version: '3.8'

services:
  retail-app:
    build: .
    image: yashpatelldocker/retail-app:1.0.0
    container_name: retail-service
    ports:
      - "8080:8080"
    restart: unless-stopped

  retail-db:
    image: postgres:15-alpine
    container_name: retail-db
    environment:
      POSTGRES_DB: retaildb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
